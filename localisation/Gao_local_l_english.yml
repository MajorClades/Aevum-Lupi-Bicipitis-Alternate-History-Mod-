#missiosn

gao_desert_war_title:0 "The Desert War"
 gao_desert_war_desc:0 "Securing the land routes to the north is a priority in case the Empire of Africa is ever restored, in the meanwhile we will consolidate the oasis just in case."

 gao_proposals_title:0 "A Proposal"
 gao_proposals_desc:0 "The Empire of Africa may be just another challenger to our dominion but we could be more than just rivals."

 gao_to_the_kongo_title:0 "The Sea So Far Away"
 gao_to_the_kongo_desc:0 "The coastline is quite foreign to us, the distant sea is but a mirage of the dunes that maybe one day we will see the horizon in the waves."

 gao_more_conquest_title:0 "Under The Sun"
 gao_more_conquest_desc:0 "All that shines in the Lybian sun shall be our home, no foreign armies can march in our gardens without our weapons ready to be thrusted into their unprepared backs."

 gao_growing_empire_title:0 "Growing Power"
 gao_growing_empire_desc:0 "Our land is bountiful and our armies are growing in strenght, soon enough we will be the rising power that will unite the rest of the land of rivers."

 gao_old_lord_title:0 "The Old Man"
 gao_old_lord_desc:0 "The Empire of Jolof is only sleeping after the coup of Gaabdo broke the farther most provinces away from the Empire's control. We have to ensure we beat them in battle to consolidate the fall of one Empire and ensure our Rise."

 gao_new_lords_title:0 "The New Empire"
 gao_new_lords_desc:0 "An Empire requires common laws, paved roads and a language to communicate between different cultures and faiths."

 gao_west_africa_title:0 "Hegemony of West Lybia"
 gao_west_africa_desc:0 "It was not enough to claim the title from the old Jolof, we must conquer all the land around us so that only the desert shall be our border."

 gao_the_legion_of_help_title:0 "The Compromise"
 gao_the_legion_of_help_desc:0 "The African Empire sent a Legion to control and raid the trade routes of salt and gold. The legion was then stranded without support when the Empire collapsed, the soldiers began attacking our borders in search for foodstuff. It is the perfect time to try and convince them to join our armies."

 gao_victorious_legio_title:0 "Promise Kept"
 gao_victorious_legio_desc:0 "The so called 'Rumelians' or something have requested us to make them conquerors and victors, and we have delivered that and more."

 gao_warfare_tactics_title:0 "Winning Tactics"
 gao_warfare_tactics_desc:0 "History will remember our tribe as the most powerful army of Lybia, surpassing the Romans and the Jolof armies of old."

 gao_lords_of_War_title:0 "Lords of War"
 gao_lords_of_War_desc:0 "The unbeatable champions of the warfare of Lybia are our own generals which have fought hard to reach the prestige they possess now, a goal for all future generals."

 gao_cultural_victory_title:0 "Unifier Of Continents"
 gao_cultural_victory_desc:0 "We are the Empire of Lybia, destined to rule the continent and protect its people from the outside and the inside."

 gao_feudalism_title:0 "Rules And Laws"
 gao_feudalism_desc:0 "There are rules that none can break but we must create new laws so that our society can prosper into new fields and new lands."

 gao_slave_production_title:0 "Force To Work The Workforce"
 gao_slave_production_desc:0 "Above the slaves and the workers that toil our soil, we must pursue higher quality goods so that even our craftsmen are tired."

 gao_strong_leader_title:0 "Warriors of Honor"
 gao_strong_leader_desc:0 "To quickly recruit more soldiers to our cause, we will reward tribe leaders and talented officers with their own bodyguards and honorifics."

 gao_religion_power_title:0 "Heavens Above"
 gao_religion_power_desc:0 "The many birds that fly high above seem to not be concerned with the amount of proselytizing the people do underneath them."

 gao_advisory_title:0 "Tell Me Something"
 gao_advisory_desc:0 "What was once a governship of the Jolof Empire and its shield against the Indictians, Gaabdo broke the chains and now hold all the power but one man cannot rule the world, yet."

 gao_religion_standard_title:0 "Place of Mercy"
 gao_religion_standard_desc:0 "Many religions and creeds are found within our lands, some more powerful and with more followers but nonetheless they will all have their own place of safety to pay their taxes to."

 gao_state_controlled_faith_title:0 "Increase Our Foundation"
 gao_state_controlled_faith_desc:0 "As more and more land is claimed and controlled with care, we are to make sure that our seat of power stands taller than any possible conquered land."

 gao_empire_controlled_faith_title:0 "Land Below"
 gao_empire_controlled_faith_desc:0 "Expanding our options and increasing our land requires many new projects, such as more barracks for our soldiers. The solution will be to put to use the zealotry of our most faithful subjects."

 gao_grandest_army_title:0 "The Art of War"
 gao_grandest_army_desc:0 "New ways to do war are created every year, every time a soldier thinks and every time he dies; but regardless, the reason for War never changes."
