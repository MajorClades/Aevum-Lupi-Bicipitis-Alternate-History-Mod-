#Events
 gao.1.test: "The Speech"
 gao.1.desc: "In the center of the camp, a tall figure stands near our general, his skin darker than most of the other soldiers, his clothes a mix of Aldabban cloth and local pelts and he is about to speak.\n'Soldiers of Rumangia, you have travelled far from home for a Kaizar that failed you before you even built the first fort! Merchants from your homeland speak of the powerless Aldabba, your supplies have to be payed with the spoils of raids and wars you can hardly afford. Your journey through the mighty desert cannot be for nought, just to starve in the open grassland. You are sons of Conquerors, the mighty legions of Ruma! I offer to any of you who may feel sadness over your home a safe passage through the dunes, but to those that remain I offer food, water and bountiful conquest! You shall hear me speak no more but I ask one last question. Are you sheeps or soldiers?'\nThe man spoke in almost perfect African Latin but it appears that most of the Legionnaries are ready to throw their lot with the foreign king rather than be forced to march through the desert to return to the flock."
 gao.1a: "We are soldiers!"
 gao.1b: "We are Conquerors!"

 gao.2.test: "The Failed Expedition"
 gao.2.desc: "In the center of the camp, a tall figure stands near the Expedition's General, his skin darker than most of the other soldiers, his clothes a mix of Aldabban cloth and local pelts and he is about to speak.\n'Soldiers of Rumangia, you have travelled far from home for a Kaizar that failed you before you even built the first fort! Merchants from your homeland speak of the powerless Aldabba, your supplies have to be payed with the spoils of raids and wars you can hardly afford. Your journey through the mighty desert cannot be for nought, just to starve in the open grassland. You are sons of Conquerors, the mighty legions of Ruma! I offer to any of you who may feel sadness over your home a safe passage through the dunes, but to those that remain I offer food, water and bountiful conquest! You shall hear me speak no more but I ask one last question. Are you sheeps or soldiers?'\nGaabdo spoke in almost perfect African Latin but it appears that most of the Legionnaries are ready to throw their lot with the our king rather than be forced to march through the desert to return to the flock. Their General wishes to confirm our pact in more private quarters to iron out any other problems."
 gao.2a: "Soldier to Soldier, War to War."
 gao.2b: "Faith to Faith, Power to Power."
