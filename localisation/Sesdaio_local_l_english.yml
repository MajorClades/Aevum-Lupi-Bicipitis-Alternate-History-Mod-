#####EVENTS
 sesda.1.test:0 "Legacy of Tax Evasion"
 sesda.1.desc:0 "The historians will debate the reasoning of the ancestors of the Sesdaio ruling class, whatever it was worth it to travel and settle the southern coast of Australia jsut to evade the payment of taxes to the Rhomanian Empire just for said Empire to settle on the island a couple years later anyway. Regardless of the useless books of those scholars, Sesdaio still thrives in spite of the death of its founder, having made pragmatic changes to its trading exports and imports, but this may change in the coming years as the Australian colonial administration turns its head to the rest of the island."
 sesda.1a:0 "We need more chains."
 sesda.1b:0 "We need keep calm."

 sesda.2.test:0 "Deal of the Damned"
 sesda.2.desc:0 "The Rhoman Administration of Australia hinges on the movements of the ships from the Horn of Lybia, supplying food and taking goods. Our deals with the regional pirates is to distract and plunder those ships to deprive our enemies, but we could be more proactive and simply do the pirating ourselves. We could surrender our ships to the pirates to avoid any suspicions that the Australians may have."
 sesda.2a:0 "All in."
 sesda.2b:0 "Our deal does not change."
 sesda.2c:0 "We will fight them fairly."

 sesda.3.test:0 "A Broken Link"
 sesda.3.desc:0 "Sometimes some slaves will find their way to freedom, breaking their chains and attacking their masters. We could deal with the problem now or later when it is difficulter."
 sesda.3a:0 "Damn."
 sesda.3b:0 "They will know fear."

 sesda.4.test:0 "Open Rebellion"
 sesda.4.desc:0 "The slave have made their move and are killing their former masters, if they aren't stopped, they will overthrow our control completely."
 sesda.4a:0 "Damn."

 sesda.5.test:0 "Breaking the Chains"
 sesda.5.desc:0 "We are free and the bastard slavers are being dealt with. Every piece of chain and bondage will be reforged into weapons and armors to further aid our efforts to free our kin."
 sesda.5a:0 "For Liberty!"

 sesda.6.test:0 "Names and Legends"
 sesda.6.desc:0 "As we have grown stronger and our island is fully under our control, we must decide if we wish to be known by other means than the name of one family attempt to not pay unneccessary taxes."
 sesda.6a:0 "A land of riches under the southern sky."
 sesda.6b:0 "A land of Gods ruling over bound mortals."
 sesda.6c:0 "A simply name like all others."
 sesda.6d:0 "My family is my legacy."

 sesda.7.test:0 "Police of Oppression"
 sesda.7.desc:0 "We will decide how many men we can spare to deal with any possible rebellion the slaves may come up with, their armor will be made more fear inducing than functional while they will carry a whip instead of a shield. Some advisor have even proposed the idea that slaves could be dissuaded by creating a lottery for their freedom."
 sesda.7a:0 "Enough to scare them."
 sesda.7b:0 "Outnumber the slaves."
 sesda.7c:0 "Perhaps the lottery is better."

