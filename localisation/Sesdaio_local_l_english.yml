 rx_num_slaves_desc:0 "Both how many slaves we control and how well we control them.\nProvince button §YLand Raid§! will grant§T Oppression§! based on the manpower development of the province. Coastal raids will grant§G +3§! §TOppression §!."
 rx_num_slaves_gain_modifier:0 "Oppression Gain Modifier"
 monthly_rx_num_slaves:0 "Monthly Oppression"

 rx_slave_unrest:0 "§ORebellion§!"
 rx_slave_unrest_desc:0 "The level at which our slaves are angry at us. The higher it is the more likely more slaves will join against us."
 rx_slave_unrest_gain_modifier:0 "Rebellion Gain Modifier"
 monthly_rx_slave_unrest:0 "Monthly Rebellion"

 rx_sell_slaves:0 "Quality Auction"
 rx_sell_slaves_desc:0 "Selling our most efficient and loyal slaves, we will miss them."

 rx_reward_loyalty:0 "Reward Loyalty"
 rx_reward_loyalty_desc:0 "Reward the most loyal with limited freedom."

 rx_law_of_oppression:0 "Empty Chains"
 rx_law_of_oppression_desc:0 "They don't want to be in chains and they shall no longer be."


#####MISSION
 rx_hope_for_the_best_title:0 "Our Island"
 rx_hope_for_the_best_desc:0 "Our ancestors fleed the oppression of the laws of Rhomania but the bastards have followed us all the way south, but we have managed to use their moment of weakness to take the entire island."

 rx_island_of_chains_title:0 "Our Rise"
 rx_island_of_chains_desc:0 "Sesdaio is now the sole ruler of the island of Australia, celebrations are to be had, titles to be given and maps to be drawn."

 rx_boats_boats_title:0 "Transporting Goods"
 rx_boats_boats_desc:0 "All manners of cargo are to be transported between Australia, the Horn and the Indian coast, which requires a mighty fleet to defend it and profit."

 rx_isitcargo_title:0 "Is it Cargo?"
 rx_isitcargo_desc:0 "The waves will wash away the sins of men, which is why we stay on board."

 rx_terrible_people_title:0 "Opening New Locations"
 rx_terrible_people_desc:0 "The land known to us as India contains many cultures, many kingdoms and perhaps even an Empire; it all matters little when our only business is to buy and sell everything to everyone."

 rx_cry_for_help_title:0 "Whips and Chains"
 rx_cry_for_help_desc:0 "Whips and chains make poor substitute for a powerful army, we must reform our regiments to use slaves for the more menial logistical problems."

 rx_the_navy_title:0 "Black Sails"
 rx_the_navy_desc:0 "It is impossible to determine which ship is full of pirates and which isn't, but most are on our payroll. Some of those ships are often blown far off and if they return, they speak of some islands in the east which could make our travels to India much safer."

 rx_the_supply_title:0 "Find The Demand"
 rx_the_supply_desc:0 "The demand for slaves is a fickle one, but we know for certain where our supplies can be refilled constantly."

 rx_the_demand_title:0 "The Reaping"
 rx_the_demand_desc:0 "The interior of the continent of Lybia is a vast array of dunes and jungles, some rivers and mountains, tribes and barbarians, but if it cannot be ours, we must at least try to harvest what can be harvested."

 rx_raiding_wars_title:0 "Land Grabs"
 rx_raiding_wars_desc:0 "From sea or from land, our forces take whatever they can. A new system is to be devised to better distribute the spoils to ensure that everyone gets something out."

 rx_raiding_worked_title:0 "Surplus Production"
 rx_raiding_worked_desc:0 "The guilds of Sesdaio find themselves to the brink of dissolution and we will not stop them, each and every coin must go to the treasury of our realm."

 rx_end_of_freedom_title:0 "End of Freedom"
 rx_end_of_freedom_desc:0 "Those who find themselves chained to their workstation will be reassured that their work will be worth more than themselves."

 rx_sesdaio_lot_title:0 "Put Them To Work"
 rx_sesdaio_lot_desc:0 "The city of Manneavi stands as the holdout for all those who wish to break laws, just not the one of the city, of course. The slaves in the city are mostly debitors and criminals, paying off their mistakes and working to keep the city clean."

 rx_barracks_title:0 "Force of Pressure"
 rx_barracks_desc:0 "To keep the slaves in a state of perperual submission to their rightful masters, we must arm ourselves with the best soldiers available."

 rx_just_your_average_police_title:0 "Keepers of Chains"
 rx_just_your_average_police_desc:0 "A new regiment will be created to safeguard those who hold the chains, to safeguard our realm from the almost inevitable uprising of the undeserving."

 rx_some_more_buffs_title:0 "The Price of Stability"
 rx_some_more_buffs_desc:0 "The realm is stable, the cost of living low, the road are clean and unbroken, the food is served hot in every bakery and the water flows freely from all the fountains; all it costs is someone else's freedom."

 rx_churches_title:0 "Poor But Free"
 rx_churches_desc:0 "One may not need to be chained to have little possessions and the clergy is there to support those who are willing to stay in their place for the greater good."

 rx_slave_churches_title:0 "Free Minds"
 rx_slave_churches_desc:0 "The court of our realm rewards the slaves who prove themselves more worthy free than sold, their mastery of crafts and sciences are most wanted."

 rx_never_ending_title:0 "Never Ending"
 rx_never_ending_desc:0 "The movements to free the slaves are gaining voices and arms, we must stop them from tempering with our profits."
