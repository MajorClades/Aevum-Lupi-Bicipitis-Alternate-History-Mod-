 legacy_of_sesdaio:0 "Legacy of Sesdaio"
 legacy_of_sesdaio_desc:0 "The noble Mateio Sesdaio left Allea to avoid the oppressive laws made against his means of profit, escaping the Rhoman Empire to create a state free of such laws."

