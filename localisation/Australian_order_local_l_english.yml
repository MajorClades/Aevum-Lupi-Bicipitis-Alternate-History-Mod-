l_english:
 ausor_trade_title:0 "Indian Ocean Trade"
 ausor_trade_desc:0 "From the safety of the Tetranesian Channel our traders finally feel the confidence to trade farther than ever before."

 ausor_navy_title:0 "The Order's Navy"
 ausor_navy_desc:0 "We must increase our naval capabilities if we are to protect this island from foreign incursions."

 ausor_comoros_fortress_title:0 "The Bridge to Libya"
 ausor_comoros_fortress_desc:0 "The isles of Tetranesia stand in the middle of the strait between Australia and Libya, whoever controls them controls the channel, to this end fortifications must be expanded to ensure our continued rule over the isles and to plan future expansion on the continent."

 ausor_colonial_title:0 "Colonial Heritage"
 ausor_colonial_desc:0 "In our unification of the island we have inherited the colonial institutions of Rhomania, which we will repurpose to our needs."

 ausor_army_title:0 "The Order's Army"
 ausor_army_desc:0 "We must fill the ranks of our army to expand our state and protect the faithful."

 ausor_military_buildup_title:0 "Crusader Priests"
 ausor_military_buildup_desc:0 "Building a society directed towards the military expansion of the faith is a must if we are to survive in a continent of heathens. This has to start from our priesthood, they will receive training in matters of arms and in matters of rhetoric so as to galvanise the masses into joining our armies."

 ausor_libyan_landfall_title:0 "Landfall in Libya"
 ausor_libyan_landfall_desc:0 "After gaining a foothold on the coast we must swiftly move to evangelise the heathens of the interior, from coast to coast."

 ausor_africa_all_title:0 "A Continent of Faithful"
 ausor_africa_all_desc:0 "Never before in the history of Creation had Libya been fully united and most would have thought this task impossible, but not us. Through the power invested onto us by God the most Benevolent and most High we have spread the Good Word far and wide, a whole continent of faithful Christians ready to follow the Lord's will. No one can dare deny the righteousness of our Mission and the legitimacy of our Divinely ordained Mandate. Praise be to God!"

 ausor_consolidate_faith_title:0 "Tide of Tithes"
 ausor_consolidate_faith_desc:0 "We will turn this island into a bastion for the faithful, a church in every town and village! The flow of tithes will fuel our mission."

 ausor_southern_home_title:0 "Southern Home"
 ausor_southern_home_desc:0 "Far away from the religious centres of old we need to adapt, tame the wilderness and create a new home of the faithful."

 ausor_development_title:0 "Christian Renaissance"
 ausor_development_desc:0 "Having turned our home to Christ it would be wise to sponsor a renaissance of christian thought."

 ausor_manufacturies_title:0 "Crusader Industrial Complex"
 ausor_manufacturies_desc:0 "Feeding the expansion of the faith is hard work, let's make it easier by increasing production."


