 #missions
 ausor_navy_title: "The Order's Navy"
 ausor_navy_desc: "We must increase our naval capabilities if we are to protect this island from foreign incursions."
 ausor_army_title: "The Order's Army"
 ausor_army_desc: "We must fill the ranks of our army to expand our state and protect the faithful."
 ausor_comoros_fortress_title: "The Bridge to Libya"
 ausor_comoros_fortress_desc: "The isles of Tetranesia stand in the middle of the strait between Australia and Libya, whoever controls them controls the channel, to this end fortifications must be expanded to ensure our continued rule over the isles and to plan future expansion on the continent."
 ausor_colonial_title: "Colonial Heritage"
 ausor_colonial_desc: "In our unification of the island we have inherited the colonial institutions of Rhomania, which we will repurpose to our needs."
 ausor_military_buildup_title: "Crusader Priests"
 ausor_military_buildup_desc: "Building a society directed towards the military expansion of the faith is a must if we are to survive in a continent of heathens. This has to start from our priesthood, they will receive training in matters of arms and in matters of rhetoric so as to galvanise the masses into joining our armies."
 ausor_libyan_landfall_title: "Landfall in Libya"
 ausor_libyan_landfall_desc: "After gaining a foothold on the coast we must swiftly move to evangelise the heathens of the interior, from coast to coast."
 ausor_consolidate_faith_title: "Tide of Tithes"
 ausor_consolidate_faith_desc: "We will turn this island into a bastion for the faithful, a church in every town and village! The flow of tithes will fuel our mission."
 ausor_southern_home_title: "Southern Home"
 ausor_southern_home_desc: "Far away from the religious centres of old we need to adapt, tame the wilderness and create a new home of the faithful."
 ausor_development_title: "Christian Reinassance"
 ausor_development_desc: "Having turned our home to Christ it would be wise to sponsor a reinassance of christian thought."
 ausor_manufacturies_title: "Crusader Industrial Complex"
 ausor_manufacturies_desc: "Feeding the expansion of the faith is hard work, let's make it easier by increasing production."
 ausor_trade_title: "Indian Ocean Trade"
 ausor_trade_desc: "From the safety of the Tetranesian Channel our traders finally feel the confidence to trade farther than ever before."

 ausor_africa_all_title: "A Continent of Faithful"
 ausor_africa_all_desc: "Never before in the history of Creation had Libya been fully united and most would have thought this task impossible, but not us. Through the power invested onto us by God the most Benevolent and most High we have spread the Good Word far and wide, a whole continent of faithful Christians ready to follow the Lord's will. No one can dare deny the righteousness of our Mission and the legitimacy of our Divinely ordained Mandate. Praise be to God!"