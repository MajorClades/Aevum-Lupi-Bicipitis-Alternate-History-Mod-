  desc_faded_osiris_aspect:0 "The old memories and legends of the God Osiris, confusing and contradictory."
	desc_osiris_serapis_aspect:0 "Serapis is the union of Osiris and Apis, spread by Ptolemy and the Roman Empire afterwards, his main role is to protect the dead, cattle and kings."
	desc_osiris_dyonisus_aspect:0 "Dyosiris is the union of Osiris and Dyonisus." 
	desc_osiris_living_aspect:0 "Osiris is alive by the efforts of the rest of the pantheon against the encroaching cult of the Romans." 

	desc_faded_ra_aspect:0 "The old memories and legends of the God Ra, confusing and contradictory."
	desc_ra_amun_aspect:0 "Amun-Ra was given the official title 'King of the Gods' by worshippers, and images show the combined deity as a red-eyed man with a lion's head that had a surrounding solar disk." 
	desc_ra_atum_aspect:0 "Atum-Ra was closely linked with the Sun, and was also a creator god of the Ennead. Both Ra and Atum were regarded as the father of the deities and pharaohs and were widely worshipped." 
	desc_ra_ephnuti_aspect:0 "Ra-Ephnuti is the union of the Christian God and the Sun God Ra." 

