l_english:
 mekh_the_council_of_13_title:0 "Council of One and Dozen"
 mekh_the_council_of_13_desc:0 "The colonial administration of Rhomania in Australia is controlled by one Governor and a couple of families of nobles, traders or priests; this is rather inefficent with many trying to take what little power they can have in this island. This is where we will play them against the other until our eventual takeover."

 mekh_class_divisions_title:0 "Class Acts"
 mekh_class_divisions_desc:0 "The division of nobles and peasants are clear and evident in all societies, but we must consider that our purpose is for all betterment of humanity, alas we must make use of all humanity to achieve it."

 mekh_our_foundations_title:0 "Our Foundation"
 mekh_our_foundations_desc:0 "The Australian people must not be made aware of the sacrifices and the necessary means to achieve our goals. The Foundation shall be made to secure, protect and contain any of the progress we made that could be used to harm us."

 mekh_medicine_title:0 "Health At All Costs"
 mekh_medicine_desc:0 "The need for medicine can only be surpassed by the need for food and shelter, but our answers for those needs can evolve. We will enstablish better treatments for injuries and diseases and write new books if the procedures work."

 mekh_of_humors_and_balance_title:0 "Of Humors and Balances"
 mekh_of_humors_and_balance_desc:0 "The humors must be balanced if the treatment is to be successful, or so were the old ways, now we know better or at least we think so. The demand to advance our understanding of the human body surpasses the actual number of diseased or harmed."

 mekh_dealers_title:0 "The Elixir of Immortality"
 mekh_dealers_desc:0 "It must be achievable. The right combinations of distilled essences will surely empower the body and mind to reach beyond the humanly possible."

 mekh_the_question_of_food_title:0 "It Will Grow"
 mekh_the_question_of_food_desc:0 "With proper care and the right books, we can make any plant grow anywhere. Our first means to achieve governmental power will be through the procurament of foodstuff and ensuring our people do not starve."

 mekh_the_workforce_title:0 "A Force At Work"
 mekh_the_workforce_desc:0 "The jungles of eastern Australia are keeping good terrain from being properly developed and keeping some rebels hidden from our armies, it is time to trim those edges."

 mekh_marine_force_title:0 "Defenders of the Waters"
 mekh_marine_force_desc:0 "Once the center of the island is mapped and tamed, we will need a proper army dedicated to protecting just our coastline. Regiments who shall be responsible for defending against pirates and our enemies, but they will be protected themselves with the best crafted armor we can produced."

 mekh_the_good_stuff_title:0 "Gift To Others"
 mekh_the_good_stuff_desc:0 "From all over the planet, exotic fruits and spices make for great flavors and potent drinks, after due testing and documenting, we can deliver the less useful goods to the masses."

 mekh_the_cyber_fleet_title:0 "The Steering Fleet"
 mekh_the_cyber_fleet_desc:0 "Our fleet is the pride of our nation, unbreakable by cannon fire, protectors of progress. The only problem is our ships have no standard construction, each having little modifications or inventions, we must create more sensible directives and contain our expenses."

 mekh_the_matter_of_stability_title:0 "As Nothing Changed"
 mekh_the_matter_of_stability_desc:0 "With our ties to the Rhomanian Empire cut, we are now on our own, but the populace must not be made aware of this."

 mekh_our_island_title:0 "Our Island"
 mekh_our_island_desc:0 "The island of Australia, discovered many centuries ago, was home to a now gone civilization, to then be settled by indians and celts, christians and slavers. Now it is all under our control, no longer are we the colony of an unbothered empire but a mighty realm of our own. The question of our future approaches."

 mekh_our_hands_title:0 "The True Force"
 mekh_our_hands_desc:0 "The human cost of our experiments keeps increasing, but we will not stop them any time soon. Our solution is to simply provide bettet shelters and better salaries to all that are willing to assist us in our march to progress. We will provide care to all soldiers that have any fighting spirit left."

 mekh_our_iron_hands_title:0 "Army of Iron Hands"
 mekh_our_iron_hands_desc:0 "Named after a general without hands, our legions march without fears as our armors are impenetrable and our weapons are always sharp, any injury that can be cured will be dealt with and any disease will be taken care of. Any missing limb replaced and the legion will keep marching on."

 mekh_expansionism_title:0 "Matters of Material"
 mekh_expansionism_desc:0 "The island of Australia is a bountiful paradise which wealth we can extract for centuries, but we cannot abuse the land we have before we invent ways to restore it. New land must be taken directly as covert methods will not suffice."

 mekh_new_laws_title:0 "Enforce The Rules"
 mekh_new_laws_desc:0 "In spite of our detachment from the Rhoman Caliphate, we still adhere to the rules and laws of the faith, perhaps with a little use of loopholes."

 mekh_rivers_gold_title:0 "Worthless Metal"
 mekh_rivers_gold_desc:0 "Theories abound around a stone that could turn things into gold, which are currently under study, but for the moment we will simply gather the gold that flows in the rivers of this island; perhaps even find some useful pyrite to make the explosive powder."

 mekh_printing_presses_title:0 "Metatron of the Masses"
 mekh_printing_presses_desc:0 "Experiments will continue till our nation improves to what God has determined to be the limit of humanity's knowledge and even them we might not be satisfied there, perhaps we will reach the star above some day."

 mekh_the_science_method_title:0 "The Scientific Method"
 mekh_the_science_method_desc:0 "The only way is forward, that part has been clear, but what about all the failures, where do they go? Do we still write them down to remember what we did wrong? Should we streamline the experiments to lower the death toll? Perhaps a good starting point would be to construct a library, a place to keep all the inventions that work."

 mekh_new_arrivals_title:0 "Restore Connections"
 mekh_new_arrivals_desc:0 "Without Rhoman support, we must properly trade and connect with the local merchants, perhaps we could make some friends."

 mekh_claws_and_screws_title:0 "Syracusan's Genius"
 mekh_claws_and_screws_desc:0 "Since the times of Archimedes, inventions have helped achieve the impossible. There are many caves and mines that could prove useful to us if we could access them without needing too many workers to gather their goods. Screws to remove water and cranes to lift materials, we must first find them."

 mekh_iron_needs_title:0 "Iron and Steel"
 mekh_iron_needs_desc:0 "The mines are extracting metals in great quantities and our roads into the country are making it easier to deliver goods between towns and cities."

 mekh_hidden_power_title:0 "Hidden Power"
 mekh_hidden_power_desc:0 "The power and force that can be produced by steam are currently unproven to be able to do much, or at least that will be until we put enough aelopyles everywhere to see what works. Hopefully nothing proves to be explosive unless that was the experiment."

 mekh_carbon_fuel_title:0 "Wheels and Wagons"
 mekh_carbon_fuel_desc:0 "While the aelopyle is being tested on ships and palaces, we still require materials to build them. More inspections of the mountains and more mines will be made, but it will be necessary to make the voyages quicker by using new specialized roadways and wagons for transport."

 mekh_fire_powder_steel_title:0 "The First Breakthrough"
 mekh_fire_powder_steel_desc:0 "With all the materials provided and ready to be used, we must prove and study the best methods of casting steel and perfecting our smelting. The benefits of stronger cannons, small firearms, ship hulls and bulletproof armors will continue to pile upon our endlessly growing list of superiority."

 mekh_the_way_of_rail_title:0 "The Way of Rails"
 mekh_the_way_of_rail_desc:0 "By putting our wagons on iron rails, with the head wagon pulled by horses or engines, we can revolutionize the way our goods are delivered and transported. The construction will take a long time and perhaps constrict our other projects but it will be worthy."

 mekh_island_of_the_future_title:0 "Island of the Future"
 mekh_island_of_the_future_desc:0 ""


 aust_capital_power_title:0 "Expand Alexia"
 aust_capital_power_desc:0 "The capital of the Australian province is located in a natural harbor, with ships loading and unloading cargo all day. Possible raids from Aktogramm pirates are discouraged by attentive arab sailors, but with the sea relatively secure, we can finally take more care of our backyard. Heathens and criminals roam the hinterlands but they dare not attack a fortified city."
 aust_growth_title:0 "Under, Not Behind"
 aust_growth_desc:0 "We may be the southest province of the Rhoman Empire but we do not skip on our book keeping and our ledgers. The Archon rules for a lifetime then a successor is voted on and chosen, preferably the son of the previous Archon, but the Basileous may hold a veto against the person. With a proper council, the Archon can administer the island properly and reap the rewards accordingly."
 aust_rebirth_title:0 "Show Of Faith"
 aust_rebirth_desc:0 "It may be a rebirth for many, a restoration of arts and sciences, but for us it is just our ascension to our own culture, our own pride for our nation."
 aust_power_title:0 "No More Strings"
 aust_power_desc:0 "WIth diplomatic acumen and with correct timing, we can finally be free to deal for own interest. No longer shall be spending our lives to save the Rhoman defeats."
 aust_island_fortress_title:0 "Fortress Australia"
 aust_island_fortress_desc:0 "Our home and our island. Even if somehow one where to breach our naval defenses, they will have to fight us on the beaches, fight us on the plains and fight us on the peaks."
 aust_colonial_expansion_title:0 "The Last Map"
 aust_colonial_expansion_desc:0 "Time and time again, cartographers have tried to make the Australian coastline and interiors, often called Darkest Australia. The map of the entirety of Australia has been done, the work of 9 cartographers combined into one singular tapestry. It will occupy the Archon's Palace main hall so that all can bask in the grand your realm is."
 aust_tax_base_title:0 "Island Autarky"
 aust_tax_base_desc:0 "With a little help from the clerical institutions, we can finally administer this island properly. Food will be distributed accordingly, taxes will be raised or lowered and trade will flow in the correct coffers."
 aust_marittime_expand_title:0 "The Archon's Navy"
 aust_marittime_expand_desc:0 "The necessary expansion of our naval power is vital for the continued control of the coast of Australia, ships from Rhomania arrive every day and we must ensure that the sea is the only one that decides who makes it to our coast."
 aust_more_island_title:0 "Awaiting Adventure"
 aust_more_island_desc:0 "Upon disbarking on the dock, many will find the opening of plenty of doors, which all lead to the wilderness of Australia, with weird monkeys and old cities. Adventurers be warned."
 aust_south_lybia_title:0 "The Golden Road"
 aust_south_lybia_desc:0 "If the tales are to be believed there is plenty of gold in those lands that are even more south than ours. And if other stories are to be believed some Raklionne merchants are trying to reach around Libya and we must stop them before they even think about it."
 aust_the_way_west_title:0 "Our Way West"
 aust_the_way_west_desc:0 "We have beaten the Raklionne merchants to the bottom of Libya but it appears to have missed quite the discovery. New land and adventures await our brave soldier in the land known to us as Veneziona."
 aust_armies_title:0 "Worth Some Salt"
 aust_armies_desc:0 "There are no volunteers in the Australian regiments, you are either born into them or someone in Rhomania believes that you are worth forgetting about in the furthest reaches of the Empire. This has created the unfortunate conditions of an army that would rather drown than follow any orders, with the sole exception of the most loyal, and paid, soldiers. Any men can join them, but few survive the first night in the jungle. Those who survive alone in the jungle for a day and a night are already considerated more valuable than most."
 aust_use_the_army_title:0 "Peace In Our Time"
 aust_use_the_army_desc:0 "Sometimes a paid soldier will be asked to put aside his weapon and pick up a tool, many of them will know this experience and we will call it peace."
 aust_expand_outside_title:0 "The Other Coast"
 aust_expand_outside_desc:0 "The Aktogramm cities became our rivals since the Kongolese blocked the easy trade routes to Rhomania but it is time to prove to them that their rivalry is one-sided."
 aust_empire_downunder_title:0 "Empire Down Under"
 aust_empire_downunder_desc:0 "All land south of the line that changes the seasons is ours, our new empire will reign over the all of the Terra Australis."
 aust_grand_armies_title:0 "Faith And Honor"
 aust_grand_armies_desc:0 "Despite our distance, we still pray. This island is full of heathens that escaped years of persecutions, even some Indian, but we must stand resolute in our faith, raise our swords and deliver God's mercy."
 aust_east_lybia_title:0 "The Competition"
 aust_east_lybia_desc:0 "With our recent conquest of the other coastline, we must deal with them in the proper ways, our inherited Rhoman ways. The Aktogramms will fuel our economy and bolster our island even more."
 aust_the_way_east_title:0 "Only One Way East"
 aust_the_way_east_desc:0 "The never ending ocean leaves way to small islands and eventually we reach the coastline of a much larger landmass. People of strange beliefs and strange cultures but the coin sees none of it, and so we push forward still."
