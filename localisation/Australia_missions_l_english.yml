l_english:
 aust_capital_power_title:0 "Expand Alexia"
 aust_capital_power_desc:0 "The capital of the Australian province is located in a natural harbor, with ships loading and unloading cargo all day. Possible raids from Aktogramm pirates are discouraged by attentive arab sailors, but with the sea relatively secure, we can finally take more care of our backyard. Heathens and criminals roam the hinterlands but they dare not attack a fortified city."

 aust_growth_title:0 "Under, Not Behind"
 aust_growth_desc:0 "We may be the southest province of the Rhoman Empire but we do not skip on our book keeping and our ledgers. The Archon rules for a lifetime then a successor is voted on and chosen, preferably the son of the previous Archon, but the Basileous may hold a veto against the person. With a proper council, the Archon can administer the island properly and reap the rewards accordingly."

 aust_rebirth_title:0 "Show Of Faith"
 aust_rebirth_desc:0 "It may be a rebirth for many, a restoration of arts and sciences, but for us it is just our ascension to our own culture, our own pride for our nation."

 aust_power_title:0 "No More Strings"
 aust_power_desc:0 "WIth diplomatic acumen and with correct timing, we can finally be free to deal for own interest. No longer shall be spending our lives to save the Rhoman defeats."

 aust_island_fortress_title:0 "Fortress Australia"
 aust_island_fortress_desc:0 "Our home and our island. Even if somehow one where to breach our naval defenses, they will have to fight us on the beaches, fight us on the plains and fight us on the peaks."

 aust_colonial_expansion_title:0 "The Last Map"
 aust_colonial_expansion_desc:0 "Time and time again, cartographers have tried to make the Australian coastline and interiors, often called Darkest Australia. The map of the entirety of Australia has been done, the work of 9 cartographers combined into one singular tapestry. It will occupy the Archon's Palace main hall so that all can bask in the grand your realm is."

 aust_tax_base_title:0 "Island Autarky"
 aust_tax_base_desc:0 "With a little help from the clerical institutions, we can finally administer this island properly. Food will be distributed accordingly, taxes will be raised or lowered and trade will flow in the correct coffers."

 aust_marittime_expand_title:0 "The Archon's Navy"
 aust_marittime_expand_desc:0 "The necessary expansion of our naval power is vital for the continued control of the coast of Australia, ships from Rhomania arrive every day and we must ensure that the sea is the only one that decides who makes it to our coast."

 aust_more_island_title:0 "Awaiting Adventure"
 aust_more_island_desc:0 "Upon disbarking on the dock, many will find the opening of plenty of doors, which all lead to the wilderness of Australia, with weird monkeys and old cities. Adventurers be warned."

 aust_south_lybia_title:0 "The Golden Road"
 aust_south_lybia_desc:0 "If the tales are to be believed there is plenty of gold in those lands that are even more south than ours. And if other stories are to be believed some Raklionne merchants are trying to reach around Libya and we must stop them before they even think about it."

 aust_the_way_west_title:0 "Our Way West"
 aust_the_way_west_desc:0 "We have beaten the Raklionne merchants to the bottom of Libya but it appears to have missed quite the discovery. New land and adventures await our brave soldier in the land known to us as Veneziona."

 aust_armies_title:0 "Worth Some Salt"
 aust_armies_desc:0 "There are no volunteers in the Australian regiments, you are either born into them or someone in Rhomania believes that you are worth forgetting about in the furthest reaches of the Empire. This has created the unfortunate conditions of an army that would rather drown than follow any orders, with the sole exception of the most loyal, and paid, soldiers. Any men can join them, but few survive the first night in the jungle. Those who survive alone in the jungle for a day and a night are already considerated more valuable than most."

 aust_use_the_army_title:0 "Peace In Our Time"
 aust_use_the_army_desc:0 "Sometimes a paid soldier will be asked to put aside his weapon and pick up a tool, many of them will know this experience and we will call it peace."

 aust_expand_outside_title:0 "The Other Coast"
 aust_expand_outside_desc:0 "The Aktogramm cities became our rivals since the Kongolese blocked the easy trade routes to Rhomania but it is time to prove to them that their rivalry is one-sided."

 aust_empire_downunder_title:0 "Empire Down Under"
 aust_empire_downunder_desc:0 "All land south of the line that changes the seasons is ours, our new empire will reign over the all of the Terra Australis."

 aust_grand_armies_title:0 "Faith And Honor"
 aust_grand_armies_desc:0 "Despite our distance, we still pray. This island is full of heathens that escaped years of persecutions, even some Indian, but we must stand resolute in our faith, raise our swords and deliver God's mercy."

 aust_east_lybia_title:0 "The Competition"
 aust_east_lybia_desc:0 "With our recent conquest of the other coastline, we must deal with them in the proper ways, our inherited Rhoman ways. The Aktogramms will fuel our economy and bolster our island even more."

 aust_the_way_east_title:0 "Only One Way East"
 aust_the_way_east_desc:0 "The never ending ocean leaves way to small islands and eventually we reach the coastline of a much larger landmass. People of strange beliefs and strange cultures but the coin sees none of it, and so we push forward still."


