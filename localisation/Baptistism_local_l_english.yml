#EVENTS

 bapti.1.t:0 "Great Baptist Council"
 bapti.1.d:0 "Once again we are all here reunited to decide the way forward of our faith. To vote upon the many exceptions to the teaching of Jahun, which to spare and which to ban."
 bapti.1a:0 "Cast the Vote, Oh Baptist."
 bapti.1b:0 "Uphold the Word, Oh Baptist."

 bapti.2.t:0 "Vote Upon Thy Wishes"
 bapti.2.d:0 "Once again we are all here reunited to decide the way forward of our faith. To vote upon the many exceptions to the teaching of Jahun, which to spare and which to ban."
 bapti.2a:0 "Cast the vote."
 bapti.2b:0 "Uphold the word."

 bapti.3.t:0 "The Indictian Curse"
 bapti.3.d:0 "The Indictians brought Christianity to our lands, but it was Jahun that converted our fathers and brought us glory. The heretical teachings of the Indictians spread and we must put an end to our communalities, our realm will surely survive longer than their so called Empire."
 bapti.3a:0 "And the Die was Cast."
 bapti.3b:0 "A recount is in order."

 bapti.4.t:0 "A Charity of Woes"
 bapti.4.d:0 "It wexes those of us who value our eternal soul but our coffers aren't infinite and our resources can only move so far, we must focus our efforts on those who are most important for us."
 bapti.4a:0 "And the Die was Cast."
 bapti.4b:0 "A recount is in order."

 bapti.5.t:0 "The Value of Tools"
 bapti.5.d:0 "What we make with our hands is what we can give or gift to others, perhaps even sell it for profit, but our hands are tied and we can only do one or the other a pillar of our faith."
 bapti.5a:0 "And the Die was Cast."
 bapti.5b:0 "A recount is in order."

 bapti.6.t:0 "The Ways We Walk"
 bapti.6.d:0 "Where we walk, we talk and our faith spreads, but we must be careful, we are not always safe in foreign lands. Perhaps we can spare some Word Bearers to aid in our endeavours outside the land governed by the Mandate."
 bapti.6a:0 "And the Die was Cast."
 bapti.6b:0 "A recount is in order."

 bapti.7.t:0 "Of Word and War"
 bapti.7.d:0 "Sometimes words aren't enough and blood must be shed, it is a waste for all to see but we must endure this blasphemy for the sake of our survival. Our words must be made clear and sharp or be made to teach how to clear and sharpen."
 bapti.7a:0 "And the Die was Cast."
 bapti.7b:0 "A recount is in order."

 bapti.8.t:0 "One Last Paragraph"
 bapti.8.d:0 "It may appear to be a mistake but our land is sacred, to traverse it or fight on it is a matter of the faith. Shall we use it to ensure a victory or spare it with a fast charge?"
 bapti.8a:0 "And the Die was Cast."
 bapti.8b:0 "A recount is in order."

 bapti.9.t:0 "The Shield of Mercy"
 bapti.9.d:0 "The people of Borgu have helped us in the past years as our scouts and defenders against the heathen empire of Wolof, in exchange they are allowed to be free in our lands as every other Iyali, in spite of their own misbegotten faith. We will make them a final offer to join in our Mandate but we will respect what duties they will chose."
 bapti.9a:0 "They are our Shield."
 bapti.9b:0 "They are our Family."

 bapti.10.t:0 "What is Sharper?"
 bapti.10.d:0 "The armies of West Lybia do not lack in experience or prowess, which means that ours needs to be prepared for everything; or perhaps we don't have to raise any blades if we poise ourselves more diplomatically. Our options are many but we are limited by the our resources and our willingness to commit fully to one path."
 bapti.10a:0 "Bolster the Word Bearers."
 bapti.10b:0 "Beguile our neighbors."
 bapti.10c:0 "Every Soldier a Saint."
 bapti.10d:0 "Conquest cost your Soul."

 bapti.11.t:0 "Return To The Path"
 bapti.11.d:0 "Our conquests have stalled and the sands can speak of the many dead, while the waters wash the bloodshed we must decide what will be the future of our Mandate. How much more blood can the sacred rivers carry to the great sea, should our words matter less than our blades, should salt be worth more than a slave, Jahun shall answer our prayers in time but until then we must decide."
 bapti.11a:0 "The Pagans will Pay and the Indictians will die."
 bapti.11b:0 "There is only one enemy left."

 bapti.12.t:0 "That Unbroken Bond"
 bapti.12.d:0 "It links all of us together, but some are more bound than others, they cannot hope to leave this world without knowing there was another way to live. The traditions of our people and those that follow the Mandate are diverse when it comes to slavery. Some decry its barbarity and some simply chose not to care for those they deem lesser; tribes and families have come to blows under our governance and we must put an end to this quarrels. One Great Baptist council will be held to decide whatever a soul can be held in bondage in this mortal plane or not."
 bapti.12a:0 "Mortal life is but a small part."
 bapti.12b:0 "We are bound only by our own faith."

 bapti.13.t:0 "The Words of War"
 bapti.13.d:0 "The Word Bearers are our most competent and professional soldiers, among them are our earliest adopters of firearms, which they have recreated from the traders. Cannons have made their first showing accompanied by the Word Bearers and the opposing side simply surrender on the spot. Our conscripts will be reforged into a modern army capable of fighting even the most advanced colonizer and we will do so with the guidance of the Word Bearers."
 bapti.13a:0 "Better tactics and equipments."
 bapti.13b:0 "The Word Bearers shall carry Victory too."

 bapti.14.t:0 "The Flame Approaches"
 bapti.14.d:0 "In spite of our best efforts, tribes and merchants still plot to tore themselves free of our Mandate, ideas and weapons appear from the ports brought by the pale foreigners. This may just be the first of many riots that we will need to break before returning to more tranquill days."
 bapti.14a:0 "They cannot break what Jahun made."

 bapti.15.t:0 "The Smoke Clears"
 bapti.15.d:0 "The fire has ceased to burn and all that is left is a most obscuring smoke, we will discover what happened after it clears, and hopefully what has burned can grow stronger for it."
 bapti.15a:0 "A more tolerant future awaits."
 bapti.15b:0 "Not all Hope is Lost for our Faith is Unbroken."
 bapti.15c:0 "It could not melt our devotion."

 bapti.16.t:0 "[ROOT.GetName]'s Riot"
 bapti.16.d:0 "A new riot has started in the province, should we allow some self governance or send in the Word Bearers?"
 bapti.16a:0 "Let them be."
 bapti.16b:0 "Send in the Army."
 bapti.16c:0 "They will perish."

 bapti.17.t:0 "This event is"
 bapti.17.d:0 "made to activate 3 other events"
 bapti.17a:0 "Let them be."

 bapti.18.t:0 "Familial Troubles"
 bapti.18.d:0 "If the heathen tribe and the merchants weren't the worst of our problems, our loyal subjects are getting upset at our mishandling of the situation."
 bapti.18a:0 "What about it?!"
 bapti.18b:0 "Get yourself a gift."
 bapti.18c:0 "Here's a gift for you."

 bapti.19.t:0 "Baptist's Tolerance"
 bapti.19.d:0 "The Baptist is our holy guide, the only successors to Jahun, but they are also mortal man, and man can make mistakes. What shall we say to those who question the Baptist decisions and laws?"
 bapti.19a:0 "The Baptist Word is the Law."
 bapti.19b:0 "Perhaps there is room for doubt."

 bapti.20.t:0 "The Foreign Threat"
 bapti.20.d:0 "The weapons sellers and slave buyers have the common goal of destabilizing our realm and we could try to ban them from docking in our ports but surely they will retaliate."
 bapti.20a:0 "Ban the exotic foreigners."
 bapti.20b:0 "Allow only some of them."

 bapti.21.t:0 "The Increasing Demand"
 bapti.21.d:0 "The threats are increasing each day that passes, but the Mandate endures. Among most rioters the demands are simply to allow more religious tolerance and more open trade with the foreigners, only a few want the dissolution of the realm of Jahun. Perhaps we can stop this fire with a more diplomatic approach."
 bapti.21a:0 "A spiritual guide and a temporal guide."
 bapti.21b:0 "The Baptist does not kneel but to God."

 bapti.22.t:0 "Failure"
 bapti.22.d:0 "Like most before you, you failed."
 bapti.22a:0 "Have some faith, Wordbearer."

 bapti.23.t:0 "Jahun's Vision"
 bapti.23.d:0 "We have restored the Mandate and surpassed even the greatest of Baptist before us. Perhaps we have even surpassed Jahun, but we will humbly leave him to be our greatest leader."
 bapti.23a:0 "We aren't tired of winning."

 bapti.24.t:0 "Coastal Defiance"
 bapti.24.d:0 "The people and tribes close to the coastline are starting to create their own little councils together, indipendent from the Great Councils or the lower councils of the Iyali. This will bring problems if not properly checked."
 bapti.24a:0 "What are they doing over there."

 bapti.25.t:0 "Eastern Defiance"
 bapti.25.d:0 "The people and tribes close to the eastern border are starting to create their own little councils together, indipendent from the Great Councils or the lower councils of the Iyali. This will bring problems if not properly checked."
 bapti.25a:0 "What are they doing over there."

 bapti.26.t:0 "Chadic Defiance"
 bapti.26.d:0 "The people and tribes close to the great Lake are starting to create their own little councils together, indipendent from the Great Councils or the lower councils of the Iyali. This will bring problems if not properly checked."
 bapti.26a:0 "What are they doing over there."

 bapti.27.t:0 "Northern Defiance"
 bapti.27.d:0 "The people and tribes close to the northern border are starting to create their own little councils together, indipendent from the Great Councils or the lower councils of the Iyali. This will bring problems if not properly checked."
 bapti.27a:0 "What are they doing over there."