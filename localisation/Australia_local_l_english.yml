l_english:
# Apoktitheí Michanikós Adeptus Mechanicus

#####EVENTS
 aust_rho.1.test:0 "A Library In Flames"
 aust_rho.1.desc:0 "'As usual ships arrived from the Egypt, one of them arrived at dusk. The scholars had arrived at our shores, tired from the long voyage I welcomed them to the palace.\nThey speak of the heathen's war against our Caliph and the siege of Alexandria, which they managed to escape from; but I know why they are here and not somewhere safer.\nThis band of heretics were found guilty against the laws of the Faith and they tried to escape to the farthest land they knew, to find someone who could allow them to make use of their knowledge.'\n- Diary of Gregorios Nikephoros, [GetYear]."
 aust_rho.1a:0 "You can stay, for now."
 aust_rho.1b:0 "Return them to the homeland."

 aust_rho.2.test:0 "Bound in Secrets"
 aust_rho.2.desc:0 "'These scholars claimed that they could make a cure for my son, which I agreed to their demands to gather the necessary materials. Hopefully their potion will work, but they have started to ask for more things, more unique materials for some experiments. They seem to have brought a recipe for greek fire which would be useful against pirates, but they claim to  be able to create more complex objects. Where will their greed for knowledge end?'\n- Diary of Gregorios Nikephoros, [GetYear]."
 aust_rho.2a:0 "Progress knows no bound."
 aust_rho.2b:0 "Perhaps, one more secret."


 aust_rho.3.test:0 "Too Many Secrets"
 aust_rho.3.desc:0 "'My child is getting better. The polymaths have started on their newest project and if I were to let them they would bankrupt the province. I will put a lid on their madness and focus them into one particular field of research.'\n- Diary of Gregorios Nikephoros, [GetYear]."
 aust_rho.3a:0 "They brought us fire."
 aust_rho.3b:0 "Hammer and steel."
 aust_rho.3c:0 "Australia rules the waves."
 
 aust_rho.4.test:0 "Destiny Broken"
 aust_rho.4.desc:0 "'My granfather once ruled Egypt until the Kongolese bastard took Memphis, since then my dynasty has been shamed to rule over this island. Far away from all that is sacred or important, sorrounded by criminals and heathens, conspirators and sickness.\nHow can I govern this island when my own son is ill and any funds may be lost in the ocean?'\n- Diary of Gregorios Nikephoros, 1444."
 aust_rho.4a:0 "Ask for any help."
 aust_rho.4b:0 "Focus on what I can do."

 aust_rho.5.test:0 "Artes Mechanicae"
 aust_rho.5.desc:0 "'Our new Republic shall prioritize the creation of mechanical nature, progress in all fields of the Arts and the increase of living quality of the Human soul. Any obstacle or blockage will be removed from achieving more knowledge at any cost.'\n- Historia 1.\nAnother book closes and many other begin to be written and rewritten, the scholars approach together their new found authority and start to draw out the responsabilities of each of the 13 souls gathered but only one shall be above the others."
 aust_rho.5a:0 "Adepts of the Machine."

 aust_rho.6.test:0 "Fire of Knowledge"
 aust_rho.6.desc:0 "'The creation of Kallinikos brings fire to the enemies of progress. Research and papers on the Siphon have been saved from Alexandria to our libraries, its use is to be moderated and controlled by one of the main Tridecagonal member.'\n- Historia 32.\nGreek Fire can be easily made on the island and the Fabricator general knows where best to use it."
 aust_rho.6a:0 "Sulphur and ashes."

 aust_rho.7.test:0 "Twelve and One"
 aust_rho.7.desc:0 "'The role of the Mekhanite shall be the steering of the ship of progress, the invisible hand that writes and the grand curator of the library.'\n- Historia 2.\nThe Supreme Mekhanite and the other 12 council members are the de facto rulers but their power is bound by the old families and the constant reminder of isolation. There are ways to remedy this faults but it is mostly time that slows their true potential, laws must be written to ensure that no outcome of the elections may hinder our arts."
 aust_rho.7a:0 "Equals in thirteen parts, but rules in tens."
 aust_rho.7b:0 "The weakness of the Flesh is left upon election."
 aust_rho.7c:0 "Dual consuls of Production and Progress."

 aust_rho.8.test:0 "The People of Progress"
 aust_rho.8.desc:0 "'The role of the People, the Demos Class, shall be of upmost importance, that which cannot be achieved by imagination and visions, must be made real, and reality requires expenditure.'\n- Historia 13.\nThe division of the classes in Australia differs from common nobility and common peasantry, outsiders will not understand that a person status or titles do not matter if the individual is the perfect match for a given experiment."
 aust_rho.8a:0 "To be used and abused for the sake of the next."
 aust_rho.8b:0 "To give oneself to progress and perhaps never return."
 aust_rho.8c:0 "There will be no waiting nor pauses, only progress."

 aust_rho.9.test:0 "Names and Legends"
 aust_rho.9.desc:0 "'The realm of the Mekhanite must be mapped and every line marked, every city accounted and every shoreline measured.'\n- Historia 44.\nWhat was once the colony of Australia is no more, a new realm of progress has risen above the waters and its name will be written in paper, stone and metal."
 aust_rho.9a:0 "A lost land now restored."
 aust_rho.9b:0 "A land of Man and Lemurs."
 aust_rho.9c:0 "A heaven for scholars and artists."
 aust_rho.9d:0 "A steering wheel for the future."
 aust_rho.9e:0 "A tribute to the first builders."
 aust_rho.9f:0 "Terra Australis still works."

 aust_rho.10.test:0 "Enemies of the Future"
 aust_rho.10.desc:0 "The imperial supporters and general revolting peasants are once again picking up arms to break our promise of a brighter future."
 aust_rho.10a:0 "Drop them in the harbour."

 aust_rho.11.test:0 "That Which Lifts Us Up"
 aust_rho.11.desc:0 "'Necessary is the creation of an organization in between the people and the council, trusted and loyal to the Mekhanite to pursue the goals of the Republic at any cost.'\n- Historia 9.\nThe Foundation is the given name to the organization of spies and loyalist to the cause of the Mekhanite, but as the realm stabilizes and grows, more distinctions have to be made to the rules that govern it."
 aust_rho.11a:0 "The House always wins, if its Foundations are everywhere."
 aust_rho.11b:0 "The Vaults cannot fail, if its Foundations are unbreakable."
 aust_rho.11c:0 "The Chains cannot break, if its Foundations are unshakeable."

 aust_rho.12.test:0 "Warriors of Science"
 aust_rho.12.desc:0 "'Creation of an army to protect the inventions can and should be given said inventions in order to perform at the best of their abilities.'\n- Historia 111.\nThe projects that permit our soldiers to fight beyond the common enemy are now to be our top priority, but which will be the first."
 aust_rho.12a:0 "The Greatest Armor to be created will be given to our best soldiers."
 aust_rho.12b:0 "To annihilate our enemies from a distance ensures our soldiers cannot be harmed."
 aust_rho.12c:0 "If all else fails, they will be restored and healed to fight again."

 aust_rho.13.test:0 "Opium of the Scholars"
 aust_rho.13.desc:0 "'The quantities of ______ cannot exceed __ lest the drinker will ____________, in order to prevent incidents, gather at least _ D-Class to test it before _______ them.'\n- Historia Redacta.\nAn elixir of the appropiate spices and the considerate use of specialized leaves of several different plants could, in theory, allow for the mortal man to experience temporarily extraordinary powers, or at least achieve a similar feeling."
 aust_rho.13a:0 "The elixir will be handled exclusively by the Supreme Mekhanite."
 aust_rho.13b:0 "A lesser version of the elixir will be given to the powerful enough to bother the Mekhanites."
 aust_rho.13c:0 "The elixir will be given to the masses, but at this potency it is nothing more than flavorful water, perhaps with less dirt in it."

 aust_rho.13.test:0 "Opium of the Scholars"
 aust_rho.13.desc:0 "'The quantities of ______ cannot exceed __ lest the drinker will ____________, in order to prevent incidents, gather at least _ D-Class to test it before _______ them.'\n- Historia Redacta.\nAn elixir of the appropiate spices and the considerate use of specialized leaves of several different plants could, in theory, allow for the mortal man to experience temporarily extraordinary powers, or at least achieve a similar feeling."
 aust_rho.13a:0 "The elixir will be handled exclusively by the Supreme Mekhanite."
 aust_rho.13b:0 "A lesser version of the elixir will be given to the powerful enough to bother the Mekhanites."

 aust_rho.14.test:0 "Opium of the Scholars"
 aust_rho.14.desc:0 "'Naval power will be necessary to defend the island, either by normal convention or by the use of riskful inventions.'\n- Historia 67.\nThe ships that leave the harbour may sink sooner than expected or they may sink scores of others before finally meeting their match, this will be streamlined and assurance will be made to the crews."
 aust_rho.14a:0 "Every ship will be top of the line."
 aust_rho.14b:0 "Fewer ships but stronger."

 aust_rho.100.test:0 "Dialectical Nonsense"
 aust_rho.100.desc:0 "'Sent to aquire _______, foundation member _____ left without reporting back, him and his other collaborator are nowhere to be found.'\n- Historia Redacta.\nBothered by the lazyness of the other mekhanites, Yakub and his most trusted translator have set to change the political landscape of the Lybian hinterland. Armed with alleged superior intellect and the unlikely martial genius of a translator, the newly crowned 'Alexander' shall make his mark on history."
 aust_rho.100a:0 "'The likelihood of their deaths is rather high.'"
 aust_rho.100b:0 "A man-made madness."

 aust_rho.101.test:0 "Feeling Unwell"
 aust_rho.101.desc:0 "It is said the 'Alexander' is spending more and more time in his bed tent, but those are just rumors."
 aust_rho.101a:0 "Right?"
 aust_rho.101b:0 "Just rumors."

