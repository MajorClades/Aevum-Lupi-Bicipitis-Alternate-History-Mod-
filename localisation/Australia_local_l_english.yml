 secure_domus_reform:0 "The Domus"
 secure_domus_reform_desc:0 "To secure our progress, our knowledge and our rule, we require which the House of God does not, the coin. Our foundation will secure that the House always wins."

 contain_vaults_reform:0 "The Vault"
 contain_vaults_reform_desc:0 "To contain our progress, our knowledge and our rule, we shall construct great projects and defenses. The vaults of our foundation will keep the worst from happening."
 mechanic_no_more_bad_monsoons_yes: "Monsoons droughts no longer give their negative modifier."

 protect_steel_reform:0 "The Chain"
 protect_steel_reform_desc:0 "To protect our progress, our knowledge and our rule, we must steel our minds and our bodies. The brotherhood of our foundation will be forged in iron and steel."



 council_of_13_reform:0 "The Tridecagonal Council"
 council_of_13_reform_desc:0 "The Mekhanite will rule for 10 years with powers limited only by the a council of 13 of the greatest minds of the country, all ministers of their own matters of teaching."

 mekhanite_supreme_reform:0 "Supremacy of the Mekhanite"
 mekhanite_supreme_reform_desc:0 "The Mekhanite was voted in by the council and thus will rule forever until death. All decisions will be put on the Mekhanite shoulders and so will the failures."

 bicephalus_eagle_reform:0 "The Bicephalous Eagle"
 bicephalus_eagle_reform_desc:0 "The Fabricator General will be made the secondary ruler of the nation with powers mostly on the military and production of goods."

 australian_colonial_governoship:0 "Archonate of Australia"
 australian_colonial_governoship_desc:0 "The colonial administration of Australia is led by one Archon, chosen either by the Rhoman Emperor or by election. The main goal is to steer the Indian trade and control the sea for the Empire."


