l_english:
 mandate_keep_them_together_title:0 "The Good Shepherd"
 mandate_keep_them_together_desc:0 "We will guide them to the right place for them to prosper, to grow stronger and protect our way of life."

 mandate_true_master_title:0 "Masters of the Flock"
 mandate_true_master_desc:0 "There is no other house where you will be treated better, you will find your potential and fulfill your dreams. Our rules are there to protect you and keep you safe."

 mandate_truest_masters_title:0 "Guide of the Faithful"
 mandate_truest_masters_desc:0 "All know that the Baptist is the most humble host, the people simply love to be around him and you will do well to remember that."

 mandate_word_bearers_title:0 "Bearers of Words"
 mandate_word_bearers_desc:0 "The Word Bearers were the guard of Jahun, soldiers loyal to the ideals of the Baptist. They are well trained and supplied with the best weapons and armors, brought up from the Iyalis or simply from meritocracy among the troops. The news of the arrival of the Word Bearers will render any village quiet as the desert, even if the troops sent aren't Word Bearers."

 mandate_war_bearers_title:0 "Bearers of War"
 mandate_war_bearers_desc:0 "As War is inevitable, we will spread the word even in the most hostile land and against the most hostile people."

 mandate_jerusalem_title:0 "Our Jerusalem"
 mandate_jerusalem_desc:0 "Holy cities abound in this region, but one rises among all others. We will extend an olive branch to the other religions and allow their pilgrim to reach Jerusalem but it will remain ours forever."

 mandate_true_faithful_title:0 "Army of the Mandate"
 mandate_true_faithful_desc:0 "The Army needs some reforms, the soldiers need to be motivated but also restrained, their wrath must be aimed just to the enemies of the faith."

 mandate_war_path_title:0 "Grow the Mandate"
 mandate_war_path_desc:0 "As the Mandate grows, so does the Temple. The strenght of the Mandate remains in the hands of those who followed Jahun's vision and we will make sure everyone can see it too."

 mandate_faith_warriors_title:0 "Warriors of Jahun"
 mandate_faith_warriors_desc:0 "The Indictians and their armies are composed of professional warriors, paid and trained. Our armies shall grow in both quantity and quality to oppose them."

 mandate_kongo_conquest_title:0 "Control the Kwadi"
 mandate_kongo_conquest_desc:0 "The Kwadi are at risk of being influenced by the pale foreigners and their false religions, we must reach them first."

 mandate_kongo_faith_title:0 "Brothers In Faith"
 mandate_kongo_faith_desc:0 "We welcome all into the great family of the faith, the Mandate has secured the heart of Lybia from being taken by those who will hurt her."

 mandate_africa_ours_title:0 "The Northern Submission"
 mandate_africa_ours_desc:0 "The african region is under our control and the Indictian have been broken, the supremacy of the Baptist faith rendered impossible to dispute. The remaining faiths will soon follow."

 mandate_plan_ahead_title:0 "The Plan Forward"
 mandate_plan_ahead_desc:0 "The wars have stalled, our Mandate stagnates, but we will go forward with our mission, to see Jahun's dreams come true."

 mandate_hausa_house_title:0 "Destiny Fulfilled"
 mandate_hausa_house_desc:0 "Jahun's promised to bring his people to a new land of water and faith, we just need to get the rest to realize the error of their ways. They will be forgiven and we shall all have a great feast."

 mandate_the_chains_that_bind_title:0 "That Which Binds Us"
 mandate_the_chains_that_bind_desc:0 "Faith binds you to follow its doctrine, rules and laws, so that you can be a good follower, but chains bind you to your master, who cares little for you and still expects you to follow its rules. To disregard the Faith means certain doom to you and your soul, to disregard your master, may grant you freedom in this life or afterlife. Which way would you rather be bound?"

 mandate_kongo_time_title:0 "Projection of Power"
 mandate_kongo_time_desc:0 "Our Mandate will grow larger and the great powers will finally pay attention to our lands, in spite of their supposed greatness, we will beat them all."

 mandate_the_revenge_title:0 "Reason or Revenge"
 mandate_the_revenge_desc:0 "The great wall that divides us from the Indictian Empire is made of sand and dunes, great armies cannot pass through unless incredibly prepared. The Expedition is proof that the desert, once passed, will leave you alone with your enemies. With zeal or madness, we will conquer our ancestral enemy."

 mandate_aldabba_burning_title:0 "Aldabba Burning"
 mandate_aldabba_burning_desc:0 "On his deathbed, Jahun whispered of a great city, burning among the sands. We shall fulfill this last vision."

 mandate_rome_burning_title:0 "The End of The Fable"
 mandate_rome_burning_desc:0 "Indictians and many others have claimed this city to be the birthplace of the greatest empire in history. It appears to have fallen long before we arrived and we will be sure that our empire does not follow the same fate."

 mandate_nedd_for_money_title:0 "Consolidation of Charity"
 mandate_nedd_for_money_desc:0 "Those of wealth toss their coins to the ground, but those of the cloth shall make their donations worth their weight. Great temples and churches shall be made in the name of the faith, where the poor shall rest and return to provide for those who have less."

 mandate_nedd_for_paper_title:0 "Elder Scrolls"
 mandate_nedd_for_paper_desc:0 "Paper has been sold in many markets of our land and yet it remains a rare commodity, we must learn to make our own paper, so that the Indictian books shall not be the only books that are in our libraries."

 mandate_build_cities_title:0 "Builder of Cities"
 mandate_build_cities_desc:0 "Our land has plenty of space for new cities, but first we need to raise those that already exist to proper cities, compared with those on the other side of the desert."

 mandate_the_long_coast_title:0 "They Are From Far Away"
 mandate_the_long_coast_desc:0 "Pale sailors land on our shores, exotic goods are bought and sold and we are not sure we can trust these foreigners, but gold does not lie. There are more lands from across the great sea and we will surely find them."

 mandate_the_other_coast_title:0 "Different But Familiar"
 mandate_the_other_coast_desc:0 "The land is different but we took it anyway, some other nation may claim that we do not have the rights to do so, but their boats cannot reach us. Our ports grow and our coastlines are mapped, they seem to fit together."

 mandate_the_east_title:0 "The Corridor Left"
 mandate_the_east_desc:0 "Another daring campaign awaits us to our east, the Kingdom known as Kongo has fallen and we may still have time to take some piece of the horn while we still can."

 mandate_money_lenders_title:0 "Of Salt and Salary"
 mandate_money_lenders_desc:0 "The riches of our land are plenty, plenty unused. We have to organize a better system to use what we make  and what we grow. Perhaps there are someone we can ask for advice."

 mandate_organization_title:0 "Lower Councils"
 mandate_organization_desc:0 "While the great councils are used to deliberate on the ways of the faith or proclaim a new Baptist, the lower councils are mostly to handle the various tribe's problems and claims. The usual end to these councils is mostly good talk and little action, from now on the lower councils will have definite and detailed conclusions."

 mandate_plus_ultra_title:0 "Fruits of the Family"
 mandate_plus_ultra_desc:0 "The Iyali, the household, are entrusted with the careful converting of the souls of their tribe to the faith of the Baptist, their work is paramount and those that are chosen know this. Each Iyali will be more integrated into the main governance of the Mandate, our resources will be their resources and viceversa."

 mandate_nedd_for_ivory_title:0 "The Hunt for the Horn"
 mandate_nedd_for_ivory_desc:0 "Ivory is precious to those of the faith but more so to those of the coin, our ivory has been sold as far as Tamna, or so we are told."

 mandate_reinvigoration_title:0 "Reinvigoration"
 mandate_reinvigoration_desc:0 "Years have passed and our fervor has vaned, but we are ready once again to take on the pressure of war."

 mandate_building_time_title:0 "Roads and Markets"
 mandate_building_time_desc:0 "Bustling markets and stone roads are new to our people but we will learn to live among all this chaos and thrive like all other have done, even surpass them."

 mandate_great_capital_title:0 "The Great City"
 mandate_great_capital_desc:0 "Our capital has a name, but most simply called it the City. It has grown mightly since the times of Jahun, perhaps we have accomplished his goal to bring his people to a perfect land to grow."

 mandate_the_first_title:0 "Mantle Of The First"
 mandate_the_first_desc:0 "The legends speak that this land was first to convert to Christianity and we will repurpose their monuments, statues and myths."


